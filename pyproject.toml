[project]
name = "findamental"
version = "0.1.0"
description = "Hermes skill and local tools for Bursa Malaysia financial statement lookup"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.10",
    "docling-core>=2.0",
    "mlx-vlm>=0.3.3 ; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "pymupdf>=1.24",
    "matplotlib>=3.9",
    "pillow>=11.0",
    "openai>=1.50",
    "pandas>=2.2",
    "duckdb>=1.1",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "rich>=13.9",
    "loguru>=0.7",
    "rapidfuzz>=3.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
findamental-query = "findamental.cli:query_main"
findamental-extract = "findamental.cli:extract_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true
